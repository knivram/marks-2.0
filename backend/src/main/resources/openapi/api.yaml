openapi: 3.0.3
info:
  title: Student Marks API
  description: API for the Student Marks management system
  version: 2.0.0

paths:
  # Semester listings (reference data)
  /api/semesters:
    $ref: "./paths/semesters/semesters.yaml"
  /api/semesters/relevant:
    $ref: "./paths/semesters/semesters-relevant.yaml"

  # Marks and mark-centric views
  /api/marks:
    $ref: "./paths/marks/marks.yaml"
  /api/marks/{markId}:
    $ref: "./paths/marks/mark.yaml"
  /api/marks/{markId}/restore:
    $ref: "./paths/marks/mark-restore.yaml"
  /api/marks/calculate:
    $ref: "./paths/marks/calculate.yaml"
  /api/agenda:
    $ref: "./paths/marks/agenda.yaml"
  /api/semesters/{semesterId}/overview:
    $ref: "./paths/marks/semester-overview.yaml"
  /api/semesters/{semesterId}/averages:
    $ref: "./paths/marks/semester-averages.yaml"

  # Users (identity)
  /api/user/info:
    $ref: "./paths/users/user-info.yaml"
  /api/user/{id}/apprentice:
    $ref: "./paths/users/user-apprentices.yaml"

  # Admin subject endpoints
  /api/admin/subjects:
    $ref: "./paths/admin/subjects.yaml"
  /api/admin/subjects/{subjectId}:
    $ref: "./paths/admin/subject.yaml"

  # Admin semester endpoints
  /api/admin/semesters:
    $ref: "./paths/admin/semesters.yaml"
  /api/admin/semesters/{semesterId}:
    $ref: "./paths/admin/semester.yaml"

  # Admin user endpoints
  /api/admin/users:
    $ref: "./paths/admin/users.yaml"
  /api/admin/users/{userId}:
    $ref: "./paths/admin/user.yaml"
  /api/admin/users/{userId}/restore:
    $ref: "./paths/admin/user-restore.yaml"
  /api/admin/users/deleted:
    $ref: "./paths/admin/deleted-users.yaml"
  /api/admin/users/deleted/{userId}:
    $ref: "./paths/admin/deleted-user.yaml"
  /api/admin/users/apprentice:
    $ref: "./paths/admin/apprentice-search.yaml"
  /api/admin/users/supervisor:
    $ref: "./paths/admin/supervisor-search.yaml"

  # Admin connection endpoints
  /api/admin/connections:
    $ref: "./paths/admin/connections.yaml"
  /api/admin/connections/{connectionId}:
    $ref: "./paths/admin/connection.yaml"

components:
  schemas:
    # Marks
    Mark:
      $ref: "./schemas/marks/mark.yaml"
    MarkRequest:
      $ref: "./schemas/marks/mark-request.yaml"
    MarkValue:
      $ref: "./schemas/marks/mark-value.yaml"
    SubjectWithMarks:
      $ref: "./schemas/marks/subject-with-marks.yaml"
    SubjectAverage:
      $ref: "./schemas/marks/subject-average.yaml"
    SemesterOverview:
      $ref: "./schemas/marks/semester-overview.yaml"
    DashboardAverages:
      $ref: "./schemas/marks/dashboard-averages.yaml"
    Agenda:
      $ref: "./schemas/marks/agenda.yaml"

    # Semesters
    Semester:
      $ref: "./schemas/semesters/semester.yaml"
    PaginatedSemesterList:
      $ref: "./schemas/semesters/paginated-semester-list.yaml"

    # Users
    User:
      $ref: "./schemas/users/user.yaml"
    UserRole:
      $ref: "./schemas/users/user-role.yaml"

    # Admin
    Subject:
      $ref: "./schemas/admin/subject.yaml"
    SubjectRequest:
      $ref: "./schemas/admin/subject-request.yaml"
    SemesterRequest:
      $ref: "./schemas/admin/semester-request.yaml"
    UserCreateRequest:
      $ref: "./schemas/admin/user-create-request.yaml"
    ApprenticeSupervisorPair:
      $ref: "./schemas/admin/apprentice-supervisor-pair.yaml"
    ApprenticeConnectRequest:
      $ref: "./schemas/admin/apprentice-connect-request.yaml"
