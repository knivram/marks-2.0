openapi: 3.0.3
info:
  title: Student Marks API
  description: API for the Student Marks management system
  version: 2.0.0

paths:
  # Student semester endpoints
  /api/semesters:
    $ref: "./paths/student/semesters.yaml"
  /api/semesters/relevant:
    $ref: "./paths/student/semesters-relevant.yaml"
  /api/semesters/{semesterId}/overview:
    $ref: "./paths/student/semester-overview.yaml"
  /api/semesters/{semesterId}/averages:
    $ref: "./paths/student/semester-averages.yaml"

  # Agenda (global, not semester-scoped)
  /api/agenda:
    $ref: "./paths/student/agenda.yaml"

  # Student mark endpoints
  /api/semesters/{semesterId}/marks:
    $ref: "./paths/student/semester-marks.yaml"
  /api/marks/{markId}:
    $ref: "./paths/student/mark.yaml"
  /api/marks/{markId}/restore:
    $ref: "./paths/student/mark-restore.yaml"
  /api/marks/calculate:
    $ref: "./paths/student/calculate.yaml"

  # User info endpoints
  /api/user/info:
    $ref: "./paths/student/user-info.yaml"
  /api/user/{id}/apprentice:
    $ref: "./paths/student/user-apprentices.yaml"

  # Admin subject endpoints
  /api/admin/subjects:
    $ref: "./paths/admin/subjects.yaml"
  /api/admin/subjects/{subjectId}:
    $ref: "./paths/admin/subject.yaml"

  # Admin semester endpoints
  /api/admin/semesters:
    $ref: "./paths/admin/semesters.yaml"
  /api/admin/semesters/{semesterId}:
    $ref: "./paths/admin/semester.yaml"

  # Admin user endpoints
  /api/admin/users:
    $ref: "./paths/admin/users.yaml"
  /api/admin/users/{userId}:
    $ref: "./paths/admin/user.yaml"
  /api/admin/users/{userId}/restore:
    $ref: "./paths/admin/user-restore.yaml"
  /api/admin/users/deleted:
    $ref: "./paths/admin/deleted-users.yaml"
  /api/admin/users/deleted/{userId}:
    $ref: "./paths/admin/deleted-user.yaml"
  /api/admin/users/apprentice:
    $ref: "./paths/admin/apprentice-search.yaml"
  /api/admin/users/supervisor:
    $ref: "./paths/admin/supervisor-search.yaml"

  # Admin connection endpoints
  /api/admin/connections:
    $ref: "./paths/admin/connections.yaml"
  /api/admin/connections/{connectionId}:
    $ref: "./paths/admin/connection.yaml"

components:
  schemas:
    User:
      $ref: "./schemas/user.yaml"
    SimpleUser:
      $ref: "./schemas/simple-user.yaml"
    UserRole:
      $ref: "./schemas/user-role.yaml"
    ApprenticeSupervisorPair:
      $ref: "./schemas/apprentice-supervisor-pair.yaml"
    ApprenticeConnectRequest:
      $ref: "./schemas/apprentice-connect-request.yaml"
    Mark:
      $ref: "./schemas/mark.yaml"
    MarkRequest:
      $ref: "./schemas/mark-request.yaml"
    MarkValue:
      $ref: "./schemas/mark-value.yaml"
    MarkWithSubject:
      $ref: "./schemas/mark-with-subject.yaml"
    Subject:
      $ref: "./schemas/subject.yaml"
    SubjectRequest:
      $ref: "./schemas/subject-request.yaml"
    SubjectWithMarks:
      $ref: "./schemas/subject-with-marks.yaml"
    SubjectAverage:
      $ref: "./schemas/subject-average.yaml"
    SemesterOverview:
      $ref: "./schemas/semester-overview.yaml"
    DashboardAverages:
      $ref: "./schemas/dashboard-averages.yaml"
    Agenda:
      $ref: "./schemas/agenda.yaml"
    Semester:
      $ref: "./schemas/semester.yaml"
    SemesterRequest:
      $ref: "./schemas/semester-request.yaml"
    PaginatedSemesterList:
      $ref: "./schemas/paginated-semester-list.yaml"
