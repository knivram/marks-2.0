get:
  tags: [StudentSemesters]
  operationId: getSemesterOverview
  summary: Get semester overview with marks grouped by subject
  parameters:
    - name: semesterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: userId
      in: query
      required: false
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Semester overview
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/SemesterOverview"
