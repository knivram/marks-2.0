post:
  tags: [StudentMarks]
  operationId: restoreMark
  summary: Restore a soft-deleted mark
  parameters:
    - name: markId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Restored mark with subject
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/MarkWithSubject"
