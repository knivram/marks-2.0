post:
  tags: [Admin]
  operationId: adminRestoreUser
  summary: Restore a soft-deleted user
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Restored user
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/User"
