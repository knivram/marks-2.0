get:
  tags: [Admin]
  operationId: adminSearchApprentices
  summary: Search for apprentices by email
  parameters:
    - name: searchQuery
      in: query
      required: false
      schema:
        type: string
        default: ""
  responses:
    '200':
      description: List of matching apprentices
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/User"
