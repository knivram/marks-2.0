get:
  tags: [Admin]
  operationId: adminGetAllSubjects
  summary: Get all subjects
  responses:
    '200':
      description: List of subjects
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/Subject"
post:
  tags: [Admin]
  operationId: adminAddSubject
  summary: Create a new subject
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../api.yaml#/components/schemas/SubjectRequest"
  responses:
    '200':
      description: Created subject
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/Subject"
