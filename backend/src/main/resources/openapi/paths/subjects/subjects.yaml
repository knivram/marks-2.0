get:
  tags: [Subjects]
  operationId: getAllSubjectsForCurrentUser
  summary: Get subjects for a user in a semester
  parameters:
    - name: semesterId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    - name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: List of subject overviews
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/SubjectOverview"
post:
  tags: [Subjects]
  operationId: addSubject
  summary: Create a new subject
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../api.yaml#/components/schemas/SubjectRequest"
  responses:
    '200':
      description: Created subject
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/Subject"
