get:
  tags: [Subjects]
  operationId: getFullSubject
  summary: Get full subject details with marks
  parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: semesterId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    - name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Full subject with marks
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/FullSubject"
