put:
  tags: [Subjects]
  operationId: editSubject
  summary: Edit an existing subject
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../api.yaml#/components/schemas/SubjectRequest"
  responses:
    '200':
      description: Updated subject
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/Subject"
