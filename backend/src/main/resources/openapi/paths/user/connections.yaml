get:
  tags: [Users]
  operationId: getConnections
  summary: Get apprentice-supervisor connections
  parameters:
    - name: supervisor-id
      in: query
      required: false
      schema:
        type: string
        default: ""
  responses:
    '200':
      description: List of connections
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/ApprenticeSupervisorPair"
put:
  tags: [Users]
  operationId: updateConnections
  summary: Update multiple apprentice-supervisor connections
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../api.yaml#/components/schemas/ApprenticeSupervisorPair"
  responses:
    '200':
      description: Updated connections
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/ApprenticeSupervisorPair"
