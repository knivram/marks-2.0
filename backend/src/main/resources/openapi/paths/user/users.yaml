get:
  tags: [Users]
  operationId: returnAllUsers
  summary: Get all users with optional search
  parameters:
    - name: searchQuery
      in: query
      required: false
      schema:
        type: string
        default: ""
  responses:
    '200':
      description: List of users
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/User"
post:
  tags: [Users]
  operationId: addUser
  summary: Create a new user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../api.yaml#/components/schemas/SimpleUser"
  responses:
    '204':
      description: User created
