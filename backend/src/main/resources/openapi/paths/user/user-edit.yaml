put:
  tags: [Users]
  operationId: editUser
  summary: Edit an existing user
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../api.yaml#/components/schemas/User"
  responses:
    '200':
      description: Updated user
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/User"
