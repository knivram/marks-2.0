get:
  tags: [Marks]
  operationId: getPassedExams
  summary: Get passed exams for a user
  parameters:
    - name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: List of passed exams
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/Mark"
