get:
  tags: [Marks]
  operationId: getFutureExams
  summary: Get future exams for a user
  parameters:
    - name: userId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: List of future exams
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../api.yaml#/components/schemas/Mark"
