get:
  tags: [Semesters]
  operationId: getAllSemesters
  summary: Get all semesters (paginated)
  parameters:
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
  responses:
    '200':
      description: Paginated list of semesters
      content:
        application/json:
          schema:
            $ref: "../../api.yaml#/components/schemas/PaginatedSemesterList"
