type: object
required:
  - subjectId
  - name
  - isVocationalModule
  - markAverage
  - description
properties:
  subjectId:
    type: string
    format: uuid
  name:
    type: string
  isVocationalModule:
    type: boolean
  description:
    type: string
    nullable: true
  markAverage:
    type: integer
