type: object
required:
  - id
  - name
  - subject
  - date
  - weight
  - value
  - semesterId
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
  subject:
    $ref: "./subject.yaml"
  date:
    type: string
    format: date
  weight:
    type: integer
  value:
    type: integer
    nullable: true
  semesterId:
    type: string
    format: uuid
