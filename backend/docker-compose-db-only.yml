# Use postgres/example user/password credentials
version: '3.1'

services:
  postgres:
    image: postgres:14
    restart: always
    ports:
      - '3134:5432'
    volumes:
      - ../dockerData/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: 'develop'
      POSTGRES_PASSWORD: 'develop'
      POSTGRES_MULTIPLE_DATABASES: 'student_marks:admin:marks_system,testuser:testPassword:testdatabase,gradle:password:gradlecodegen'
    networks:
      build-net:

networks:
  build-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.8.0.0/16